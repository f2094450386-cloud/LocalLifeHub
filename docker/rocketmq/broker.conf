# RocketMQ broker config for local Docker Compose.
# RocketMQ 4.9.7 is used because it is mature and easy to start in a single-node dev setup.
brokerClusterName=LocalLifeHubCluster
brokerName=broker-a
brokerId=0

# Nameserver address inside docker-compose.
namesrvAddr=rocketmq-namesrv:9876

# Default broker listen port exposed as 127.0.0.1:10911 by docker-compose.yml.
listenPort=10911

# Keep auto topic creation enabled for local development only.
autoCreateTopicEnable=true

# Delay level 11 is 15m, used by unpaid order timeout checks.
messageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 10m 15m 20m 30m 1h 2h

deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
