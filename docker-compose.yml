# LocalLifeHub local infrastructure.
# Defaults are development-only values. Override them with environment variables when needed.
services:
  mysql:
    image: mysql:8.0
    container_name: locallifehub-mysql
    restart: unless-stopped
    environment:
      # Default database imported from hmdp.sql on first container initialization.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hmdp}
      # Development password for root. Change MYSQL_ROOT_PASSWORD in real environments.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-locallifehub_root}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # MySQL imports this only when the data directory is empty.
      - ./hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
      - ./sql/20260512_add_voucher_order_unique_index.sql:/docker-entrypoint-initdb.d/02-add-voucher-order-unique-index.sql:ro
      - ./sql/20260512_add_voucher_order_task.sql:/docker-entrypoint-initdb.d/03-add-voucher-order-task.sql:ro
      - ./sql/20260512_adjust_voucher_order_active_unique_index.sql:/docker-entrypoint-initdb.d/04-adjust-voucher-order-active-unique-index.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-locallifehub_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: locallifehub-redis
    restart: unless-stopped
    # Development password. Set REDIS_PASSWORD to override; keep application-local.yml in sync.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-locallifehub_redis}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-locallifehub_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: locallifehub-rocketmq-namesrv
    user: root
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    ports:
      # RocketMQ NameServer address for future local clients: 127.0.0.1:9876.
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: locallifehub-rocketmq-broker
    user: root
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/broker.conf"]
    ports:
      # Broker ports. Keep these defaults unless they conflict locally.
      - "${ROCKETMQ_BROKER_FAST_PORT:-10909}:10909"
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_HA_PORT:-10912}:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: locallifehub-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    environment:
      # Dashboard talks to NameServer inside the Compose network.
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080"
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-8088}:8080"

volumes:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
