# Local development profile.
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=local
server:
  port: ${SERVER_PORT:8081}

app:
  security:
    admin-user-ids: ${ADMIN_USER_IDS:1}
    log-verification-code: ${LOG_VERIFICATION_CODE:true}
  upload:
    image-dir: ${IMAGE_UPLOAD_DIR:src/main/resources/nginx-1.18.0/html/hmdp/imgs}
    max-image-bytes: ${MAX_IMAGE_BYTES:5242880}
    max-image-pixels: ${MAX_IMAGE_PIXELS:40000000}

spring:
  datasource:
    # Matches docker-compose.yml MySQL defaults.
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hmdp}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:locallifehub_root}
  redis:
    # Matches docker-compose.yml Redis defaults.
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:locallifehub_redis}

# RocketMQ is used by the seckill order async creation flow.
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:local-lifehub-producer-group}
  broker-address: ${ROCKETMQ_BROKER_ADDRESS:127.0.0.1:10911}
  dashboard-url: ${ROCKETMQ_DASHBOARD_URL:http://127.0.0.1:8088}

seckill:
  release-marker-ttl-seconds: ${SECKILL_RELEASE_MARKER_TTL_SECONDS:604800}
  order-task:
    compensate-interval-ms: ${SECKILL_TASK_COMPENSATE_INTERVAL_MS:30000}
    compensate-limit: ${SECKILL_TASK_COMPENSATE_LIMIT:50}
    retry-delay-seconds: ${SECKILL_TASK_RETRY_DELAY_SECONDS:60}
    default-max-retry: ${SECKILL_TASK_DEFAULT_MAX_RETRY:5}
  order-timeout:
    minutes: ${SECKILL_ORDER_TIMEOUT_MINUTES:15}
    delay-level: ${SECKILL_ORDER_TIMEOUT_DELAY_LEVEL:11}
    message-timeout-ms: ${SECKILL_ORDER_TIMEOUT_MESSAGE_TIMEOUT_MS:3000}
    scan-interval-ms: ${SECKILL_ORDER_TIMEOUT_SCAN_INTERVAL_MS:60000}
    scan-limit: ${SECKILL_ORDER_TIMEOUT_SCAN_LIMIT:100}

ai:
  customer-service:
    active: ${AI_ACTIVE:deepseek}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
    qwen:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_MODEL:qwen-plus}
    xiaomi:
      base-url: ${XIAOMI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
      api-key: ${XIAOMI_API_KEY:}
      model: ${XIAOMI_MODEL:mimo-v2.5-pro}
    timeout-ms: ${AI_CUSTOMER_SERVICE_TIMEOUT_MS:10000}
    max-memory-messages: ${AI_CUSTOMER_SERVICE_MAX_MEMORY_MESSAGES:20}
    stream-timeout-ms: ${AI_CUSTOMER_SERVICE_STREAM_TIMEOUT_MS:60000}
