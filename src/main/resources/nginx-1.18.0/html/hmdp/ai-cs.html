<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邻享生活 AI 客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5; height: 100vh; display: flex; flex-direction: column;
    max-width: 720px; margin: 0 auto;
  }
  .header {
    background: #fff; padding: 14px 20px; text-align: center;
    font-size: 17px; font-weight: 600; color: #333;
    border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; z-index: 1;
  }
  .header .back {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: #1677ff; cursor: pointer; text-decoration: none;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 12px;
    font-size: 15px; line-height: 1.6; word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: #1677ff; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #fff; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .msg.assistant .typing::after { content: "●"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg.error { align-self: flex-start; background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
  .input-area {
    display: flex; gap: 8px; padding: 12px 16px; background: #fff;
    border-top: 1px solid #e8e8e8;
  }
  .input-area input {
    flex: 1; padding: 10px 14px; border: 1px solid #d9d9d9;
    border-radius: 20px; font-size: 15px; outline: none;
  }
  .input-area input:focus { border-color: #1677ff; }
  .input-area button {
    padding: 10px 20px; background: #1677ff; color: #fff; border: none;
    border-radius: 20px; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  .input-area button:disabled { background: #91caff; cursor: not-allowed; }
  .welcome { text-align: center; color: #999; font-size: 14px; margin-top: 40px; }
  .login-hint {
    text-align: center; color: #999; font-size: 14px; margin-top: 60px;
  }
  .login-hint a { color: #1677ff; text-decoration: none; }
</style>
</head>
<body>
<div class="header">
  <a class="back" href="index.html">&larr; 返回</a>
  邻享生活 AI 客服
</div>
<div class="messages" id="messages">
  <div class="welcome" id="welcome">你好！我是邻享生活 AI 客服，有什么可以帮助你的？</div>
</div>
<div class="input-area">
  <input id="input" type="text" placeholder="输入问题..." autofocus onkeydown="if(event.key==='Enter')send()">
  <button id="sendBtn" onclick="send()">发送</button>
</div>
<script>
  const token = sessionStorage.getItem('token');
  if (!token) {
    document.getElementById('welcome').outerHTML =
      '<div class="login-hint">请先<a href="login.html">登录</a>后使用 AI 客服</div>';
    document.getElementById('input').disabled = true;
    document.getElementById('sendBtn').disabled = true;
  }

  const sessionId = sessionStorage.getItem('ai-cs-sid') || crypto.randomUUID();
  sessionStorage.setItem('ai-cs-sid', sessionId);

  function appendMsg(role, text, error) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    if (error) el.className += ' error';
    el.textContent = text;
    document.getElementById('messages').appendChild(el);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    return el;
  }

  async function send() {
    if (!token) return;
    const input = document.getElementById('input');
    const btn = document.getElementById('sendBtn');
    const message = input.value.trim();
    if (!message) return;

    document.getElementById('welcome')?.remove();
    input.value = '';
    input.disabled = true;
    btn.disabled = true;

    appendMsg('user', message);
    const assistantEl = appendMsg('assistant', '');
    assistantEl.innerHTML = '<span class="typing"></span>';

    try {
      const resp = await fetch('/api/ai/customer-service/chat/stream', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'authorization': token
        },
        body: JSON.stringify({ message, sessionId })
      });

      if (resp.status === 401) {
        assistantEl.textContent = '';
        appendMsg('assistant', '登录已过期，请重新登录', true);
        setTimeout(function() { location.href = 'login.html'; }, 1500);
        return;
      }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6));
              if (data.done) {
                if (data.sessionId) sessionStorage.setItem('ai-cs-sid', data.sessionId);
                if (assistantEl.textContent === '') {
                  assistantEl.textContent = data.error || '未查询到相关数据';
                }
                return;
              }
              assistantEl.textContent += data.token || '';
              document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            } catch (e) { /* ignore partial */ }
          }
        }
      }
    } catch (e) {
      assistantEl.textContent = 'AI客服暂时不可用，请稍后再试';
      assistantEl.className += ' error';
    } finally {
      input.disabled = false;
      btn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
